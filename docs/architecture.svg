<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">A map of the browser, Express server, routes, library modules, configuration and JSON data store, with the numbered order placement flow and the invoice module highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#53657d"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172338}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#53657d}
      .head{font-size:16px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#47566b}
      .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.card{fill:#fff;stroke:#bdc9d8;stroke-width:1.3}
      .route{fill:#eef5ff;stroke:#a9c4e7;stroke-width:1.2}.focus{fill:#fff3d8;stroke:#db8d16;stroke-width:2.4}
      .line{fill:none;stroke:#53657d;stroke-width:1.8;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#718198;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .num{fill:#254d78}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="28" y="37" class="title">ShopLedger | Application architecture</text>
  <text x="28" y="60" class="subtitle">Node / Express POS · Khata credit ledger · GST invoicing · local JSON persistence</text>

  <!-- Request-facing components -->
  <rect x="24" y="82" width="206" height="176" rx="10" class="panel"/>
  <text x="40" y="108" class="head">Browser UI</text>
  <text x="40" y="132" class="body">public/</text>
  <text x="40" y="153" class="small">index.html · js/app.js · css/style.css</text>
  <text x="40" y="180" class="small">POS, orders, Khata, reports</text>
  <text x="40" y="201" class="small">POST /api/orders</text>
  <text x="40" y="222" class="small">Invoice link opens printable HTML</text>
  <text x="40" y="243" class="small">XHR helpers: get(), post()</text>

  <rect x="262" y="82" width="220" height="176" rx="10" class="panel"/>
  <text x="278" y="108" class="head">server.js</text>
  <text x="278" y="132" class="small">Express app + JSON body parser</text>
  <text x="278" y="153" class="small">Serves public/ static assets</text>
  <text x="278" y="174" class="small">Mounts all four routers at /api</text>
  <text x="278" y="199" class="small">GET /orders/:id/invoice</text>
  <text x="278" y="220" class="small">orders.get() → invoice.render()</text>
  <text x="278" y="243" class="small">Starts listener when run directly</text>

  <rect x="514" y="72" width="316" height="286" rx="10" class="panel"/>
  <text x="530" y="98" class="head">routes/</text>
  <rect x="528" y="110" width="288" height="52" rx="7" class="route"/>
  <text x="542" y="131" class="body" font-weight="700">orders.js</text><text x="542" y="150" class="small">GET /orders · POST /orders · cancel</text>
  <rect x="528" y="170" width="288" height="52" rx="7" class="route"/>
  <text x="542" y="191" class="body" font-weight="700">products.js</text><text x="542" y="210" class="small">GET /products · GET /coupons</text>
  <rect x="528" y="230" width="288" height="52" rx="7" class="route"/>
  <text x="542" y="251" class="body" font-weight="700">customers.js</text><text x="542" y="270" class="small">GET /customers · POST settlement</text>
  <rect x="528" y="290" width="288" height="52" rx="7" class="route"/>
  <text x="542" y="311" class="body" font-weight="700">reports.js</text><text x="542" y="330" class="small">dashboard · GST recon · pricing preview · export</text>

  <rect x="862" y="82" width="314" height="176" rx="10" class="panel"/>
  <text x="880" y="108" class="head">config.js</text>
  <text x="880" y="132" class="small">Port and shop / GST identity</text>
  <text x="880" y="153" class="small">HSN slabs + default GST rate</text>
  <text x="880" y="174" class="small">Coupon definitions + admin key</text>
  <text x="880" y="201" class="small">Read by tax.js, coupons.js, invoice.js</text>
  <text x="880" y="226" class="small">Inventory defaults</text>

  <path d="M230 168 H256" class="line"/>
  <path d="M482 168 H508" class="line"/>
  <path d="M830 168 H856" class="dash"/>
  <text x="232" y="158" class="small">HTTP</text>
  <text x="485" y="158" class="small">mounts</text>

  <!-- Library modules -->
  <rect x="24" y="382" width="806" height="371" rx="10" class="panel"/>
  <text x="42" y="408" class="head">lib/ · application and domain logic</text>
  <rect x="42" y="422" width="374" height="58" rx="7" class="card"/>
  <text x="56" y="444" class="body" font-weight="700">coupons.js</text><text x="56" y="464" class="small">normalizeCode() · validate() · calculateDiscount() · listActive()</text>
  <rect x="434" y="422" width="374" height="58" rx="7" class="card"/>
  <text x="448" y="444" class="body" font-weight="700">dates.js</text><text x="448" y="464" class="small">today() · normalizeDateKey() · getFiscalYear()</text>

  <rect x="42" y="490" width="374" height="58" rx="7" class="card"/>
  <text x="56" y="512" class="body" font-weight="700">inventory.js</text><text x="56" y="532" class="small">find() · getSellableStock() · check() · reserve() · release() · summarize()</text>
  <rect x="434" y="490" width="374" height="58" rx="7" class="card"/>
  <text x="448" y="512" class="body" font-weight="700">ledger.js</text><text x="448" y="532" class="small">findCustomer() · listCustomers() · chargeOrderToKhata() · settlements</text>

  <rect x="42" y="558" width="374" height="58" rx="7" class="focus"/>
  <text x="56" y="580" class="body" font-weight="700">invoice.js  ·  TICKET FOCUS</text><text x="56" y="600" class="small">computeInvoiceFigures() · render()  |  printable HTML</text>
  <rect x="434" y="558" width="374" height="58" rx="7" class="card"/>
  <text x="448" y="580" class="body" font-weight="700">orders.js</text><text x="448" y="600" class="small">add() · get() · cancel() · list()</text>

  <rect x="42" y="626" width="374" height="58" rx="7" class="card"/>
  <text x="56" y="648" class="body" font-weight="700">pricing.js</text><text x="56" y="668" class="small">subtotal() · discount() · computeTotals() → coupons.js + tax.js</text>
  <rect x="434" y="626" width="374" height="58" rx="7" class="card"/>
  <text x="448" y="648" class="body" font-weight="700">reports.js</text><text x="448" y="668" class="small">getDashboardSummary() · getGstReconciliation() → invoice figures</text>

  <rect x="42" y="694" width="374" height="44" rx="7" class="card"/>
  <text x="56" y="713" class="body" font-weight="700">store.js</text><text x="56" y="731" class="small">read() · write() · appendAudit()</text>
  <rect x="434" y="694" width="374" height="44" rx="7" class="card"/>
  <text x="448" y="713" class="body" font-weight="700">tax.js</text><text x="448" y="731" class="small">getRateForItem() · getSlabPercent() · splitCgstSgst()</text>

  <!-- Persistence and order flow -->
  <rect x="862" y="302" width="314" height="120" rx="10" class="panel"/>
  <text x="880" y="329" class="head">data/db.json</text>
  <text x="880" y="353" class="small">Products · customers · orders</text>
  <text x="880" y="374" class="small">Settlements · audit log · ID counters</text>
  <text x="880" y="399" class="small">Read / rewritten by lib/store.js</text>
  <path d="M830 716 C852 716 845 400 856 400" class="line"/>
  <path d="M862 210 C842 210 850 335 824 335" class="dash"/>

  <rect x="862" y="442" width="314" height="311" rx="10" class="panel"/>
  <text x="880" y="469" class="head">Order placement · numbered flow</text>
  <circle cx="884" cy="497" r="10" class="num"/><text x="884" y="501" class="numtext">1</text><text x="902" y="502" class="small">UI sends POST /api/orders</text>
  <circle cx="884" cy="526" r="10" class="num"/><text x="884" y="530" class="numtext">2</text><text x="902" y="531" class="small">server.js dispatches orders router</text>
  <circle cx="884" cy="555" r="10" class="num"/><text x="884" y="559" class="numtext">3</text><text x="902" y="560" class="small">store.read() loads current JSON</text>
  <circle cx="884" cy="584" r="10" class="num"/><text x="884" y="588" class="numtext">4</text><text x="902" y="589" class="small">inventory.find() + check() validate stock</text>
  <circle cx="884" cy="613" r="10" class="num"/><text x="884" y="617" class="numtext">5</text><text x="902" y="618" class="small">pricing + coupons + tax compute totals</text>
  <circle cx="884" cy="642" r="10" class="num"/><text x="884" y="646" class="numtext">6</text><text x="902" y="647" class="small">Khata charge if selected; reserve stock</text>
  <circle cx="884" cy="671" r="10" class="num"/><text x="884" y="675" class="numtext">7</text><text x="902" y="676" class="small">orders.add() + audit; store.write() persists</text>
  <circle cx="884" cy="700" r="10" class="num"/><text x="884" y="704" class="numtext">8</text><text x="902" y="705" class="small">Return order; optional invoice link renders invoice</text>
  <rect x="880" y="722" width="14" height="14" rx="3" class="focus"/><text x="902" y="734" class="small">Ticket focus</text>
  <rect x="1002" y="722" width="14" height="14" rx="3" class="card"/><text x="1024" y="734" class="small">Other modules</text>
</svg>
